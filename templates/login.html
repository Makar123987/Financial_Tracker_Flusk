{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<p class="eyebrow">Welcome back</p><h1>Log in to your account</h1><p class="subtitle">Pick up where you left off and see your finances clearly.</p>
<section class="card form-card">
  <form action="/login" method="post">
    <div class="field"><label for="email">Email</label><input type="email" id="email" name="email" autocomplete="email"></div>
    <div class="field"><label for="password">Password</label><input type="password" id="password" name="password" autocomplete="current-password"></div>
    <button type="submit">Log in &rarr;</button>
  </form>
  <p class="muted" style="margin:22px 0 0">New here? <a href="/register">Create an account</a></p>
</section>
{% endblock %}
