<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Financial Tracker{% endblock %} | Financial Tracker</title>
  <style>
    :root { color-scheme: light; --navy:#10234b; --blue:#2459cc; --blue-dark:#1945a5; --red:#d94d5e; --ink:#182a4b; --muted:#71809b; --line:#e5ebf5; --surface:#fff; --bg:#f4f7fc; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:Inter,Segoe UI,Arial,sans-serif; line-height:1.5; }
    a { color:var(--blue); text-decoration:none; } a:hover { text-decoration:underline; }
    .topbar { background:var(--navy); color:white; }
    .nav-wrap { max-width:1320px; margin:auto; padding:0 32px; display:flex; align-items:center; gap:38px; min-height:76px; }
    .brand { color:white; font-weight:800; font-size:18px; letter-spacing:-.04em; white-space:nowrap; display:flex; align-items:center; gap:10px; }
    .brand:hover, .nav a:hover { text-decoration:none; }
    .brand-mark { display:grid; place-items:center; width:34px; height:34px; border-radius:10px; background:var(--blue); color:white; font-size:20px; }
    .nav { display:flex; align-items:center; gap:5px; flex-wrap:wrap; flex:1; }
    .nav a { color:#c4d0e9; font-size:13px; font-weight:600; padding:9px 10px; border-radius:8px; }
    .nav a:hover, .nav a.active { color:white; background:#263b68; }
    .nav .logout { margin-left:auto; color:#ffb6be; }
    main { max-width:1256px; margin:0 auto; padding:46px 32px 70px; }
    .eyebrow { color:var(--blue); font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.14em; margin:0 0 9px; }
    h1,h2,h3,p { margin-top:0; } h1 { font-size:clamp(30px,4vw,42px); letter-spacing:-.045em; line-height:1.15; margin-bottom:10px; } h2 { font-size:20px; letter-spacing:-.025em; margin-bottom:5px; } h3 { font-size:16px; }
    .subtitle, .muted { color:var(--muted); } .subtitle { margin-bottom:30px; }
    .card { background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:26px; box-shadow:0 8px 30px rgba(27,54,105,.045); margin-bottom:22px; }
    .card-header { display:flex; justify-content:space-between; gap:16px; align-items:center; margin-bottom:22px; } .card-header p { margin:3px 0 0; font-size:13px; }
    .button, button, input[type=submit] { display:inline-flex; align-items:center; justify-content:center; border:0; border-radius:9px; padding:11px 17px; background:var(--blue); color:white; font:inherit; font-size:13px; font-weight:700; cursor:pointer; transition:background .15s; }
    .button:hover, button:hover, input[type=submit]:hover { background:var(--blue-dark); text-decoration:none; }
    .button.secondary { background:#edf2ff; color:var(--blue); } .button.secondary:hover { background:#dfe8ff; }
    .button.danger, input.danger { background:#fff0f2; color:#bd3548; } .button.danger:hover, input.danger:hover { background:#ffe0e4; }
    .actions { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    label { display:block; color:#445574; font-size:12px; font-weight:700; margin-bottom:7px; }
    input:not([type=submit]) { width:100%; min-width:0; border:1px solid #dce4f0; border-radius:9px; padding:11px 12px; font:inherit; font-size:14px; color:var(--ink); background:#fff; }
    input:focus { outline:3px solid #dbe6ff; border-color:var(--blue); }
    .field { margin-bottom:17px; } .form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0 16px; } .form-card { max-width:560px; }
    .table-wrap { width:100%; overflow-x:auto; } table { border-collapse:collapse; width:100%; text-align:left; white-space:nowrap; } th { padding:12px 14px; color:#8693aa; background:#f7f9fd; font-size:10px; letter-spacing:.1em; text-transform:uppercase; } td { padding:15px 14px; border-bottom:1px solid #edf1f7; font-size:13px; } tbody tr:last-child td { border-bottom:0; } td a + a { margin-left:12px; } .delete-link { color:var(--red); }
    .badge { display:inline-block; border-radius:30px; padding:4px 10px; background:#eaf0ff; color:var(--blue); font-size:11px; font-weight:700; } .badge.spend { background:#fff0f2; color:#c54052; }
    .filter { display:flex; gap:10px; align-items:end; flex-wrap:wrap; } .filter .field { margin:0; } .filter input { width:auto; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:22px; } .grid .card { margin-bottom:0; }
    .category-row { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:15px 0; border-bottom:1px solid var(--line); } .category-row:last-child { border-bottom:0; } .category-name { font-weight:700; }
    .hero { background:var(--navy); color:white; border-radius:20px; padding:clamp(32px,6vw,72px); position:relative; overflow:hidden; } .hero:after { content:''; position:absolute; right:-60px; top:-110px; width:350px; height:350px; border:55px solid rgba(255,255,255,.04); border-radius:50%; pointer-events:none; } .hero .eyebrow { color:#9dbbff; } .hero p { color:#c5d1e9; max-width:500px; } .hero h1 { max-width:600px; font-size:clamp(38px,5vw,58px); } .hero .actions { margin-top:26px; } .hero .button.secondary { background:white; }
    .feature-grid { margin-top:22px; } .feature-icon { display:grid; place-items:center; width:42px; height:42px; background:#edf2ff; color:var(--blue); border-radius:12px; font-weight:800; margin-bottom:20px; } .feature-icon.red { background:#fff0f2; color:var(--red); } .feature-grid p { color:var(--muted); font-size:14px; margin-bottom:0; }
    .chart-box { position:relative; height:280px; } .empty { color:var(--muted); padding:18px 0; font-size:14px; } .back { display:inline-block; margin-bottom:22px; font-size:13px; font-weight:700; }
    /* Keep text and form controls clear on light backgrounds. */
    :root { --ink:#142340; --muted:#465873; }
    body { font-size:16px; }
    .nav a, .button, button, input[type=submit] { font-size:15px; }
    .eyebrow { font-size:13px; }
    .card-header p, .feature-grid p, .empty, .back { font-size:15px; }
    label { color:#283c5c; font-size:15px; }
    input:not([type=submit]), select { width:100%; min-width:0; border:1px solid #aebdd1; border-radius:9px; padding:11px 12px; font:inherit; font-size:16px; color:var(--ink); background:#fff; }
    select:focus { outline:3px solid #dbe6ff; border-color:var(--blue); }
    th { color:#40516c; font-size:13px; }
    td { font-size:15px; }
    .badge { font-size:13px; }
    .balance-card { display:flex; justify-content:space-between; align-items:center; gap:20px; margin-top:22px; flex-wrap:wrap; }
    .balance-card p { margin:4px 0 0; }
    .balance { font-size:30px; color:var(--ink); }
    .balance.positive { color:#087342; }
    .balance.negative { color:#b42335; }
    @media(max-width:800px) { .nav-wrap { padding:18px 20px; display:block; } .nav { margin-top:14px; gap:2px; } .nav a { padding:7px 8px; } .nav .logout { margin-left:0; } main { padding:32px 20px 50px; } .grid { grid-template-columns:1fr; } }
    @media(max-width:480px) { .card { padding:20px; } .form-grid { grid-template-columns:1fr; } .card-header { align-items:flex-start; flex-direction:column; } .filter .field, .filter input, .filter button { width:100%; } }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar"><div class="nav-wrap">
    <a class="brand" href="/"><span class="brand-mark">↗</span> Financial Tracker</a>
    <nav class="nav" aria-label="Main navigation">
      <a href="/" {% if request.path == '/' %}class="active"{% endif %}>Home</a>
      <a href="/transactions" {% if request.path == '/transactions' %}class="active"{% endif %}>Transactions</a>
      <a href="/category" {% if request.path == '/category' %}class="active"{% endif %}>Categories</a>
      <a href="/income" {% if request.path == '/income' %}class="active"{% endif %}>Income</a>
      <a href="/spend" {% if request.path == '/spend' %}class="active"{% endif %}>Spend</a>
      <a href="/login">Log in</a><a href="/register">Register</a><a class="logout" href="/logout">Log out</a>
    </nav>
  </div></header>
  <main>{% block content %}{% endblock %}</main>
  {% block scripts %}{% endblock %}
</body>
</html>
